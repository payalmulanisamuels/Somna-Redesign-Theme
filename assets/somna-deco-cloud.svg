<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150">
  <defs>
    <radialGradient id="p" cx="40%" cy="30%" r="72%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#f4f8ff"/>
      <stop offset=".8" stop-color="#cbdcf4"/>
      <stop offset="1" stop-color="#9fbbe4"/>
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3edfb"/>
      <stop offset="1" stop-color="#a3bde3"/>
    </linearGradient>
    <filter id="fluff" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="4" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.4"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <ellipse cx="122" cy="126" rx="88" ry="11" fill="#8eaad6" opacity=".35" filter="url(#soft)"/>
  <g filter="url(#fluff)">
    <rect x="36" y="80" width="170" height="38" rx="19" fill="url(#base)"/>
    <circle cx="64" cy="88" r="30" fill="url(#p)"/>
    <circle cx="186" cy="92" r="25" fill="url(#p)"/>
    <circle cx="150" cy="68" r="36" fill="url(#p)"/>
    <circle cx="102" cy="62" r="44" fill="url(#p)"/>
    <circle cx="126" cy="98" r="27" fill="url(#p)"/>
    <circle cx="84" cy="102" r="22" fill="url(#p)"/>
  </g>
  <g filter="url(#soft)" opacity=".95">
    <circle cx="92" cy="44" r="17" fill="#fff"/>
    <circle cx="144" cy="54" r="13" fill="#fff"/>
    <circle cx="62" cy="76" r="9" fill="#fff"/>
  </g>
</svg>
